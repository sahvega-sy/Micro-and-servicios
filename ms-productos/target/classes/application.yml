server:
  port: ${PORT:8081}

spring:
  application:
    name: ms-productos
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/clstore_productos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}"
    username: root
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: "${JWT_SECRET:clstore-dev-secret-cambiar-en-produccion-32b}"
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:5173}"
  services:
    categorias-url: "${MS_CATEGORIAS_URL:http://localhost:8082}"

management:
  endpoints:
    web:
      exposure:
        include: health
