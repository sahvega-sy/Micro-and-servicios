server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-categoria
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/clstore_categorias?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}"
    username: root
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none         
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: "${JWT_SECRET:clstore-dev-secret-cambiar-en-produccion-32b}"
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:5173}"
  services:
    productos-url: "${MS_PRODUCTOS_URL:http://localhost:8081}"

management:
  endpoints:
    web:
      exposure:
        include: health
