spring.application.name=ordenes
server.port=8083

# Conexión a MySQL en Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/ordenes_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Desactivar verificación estricta de compatibilidad de versión de Spring Cloud
spring.cloud.compatibility-verifier.enabled=false